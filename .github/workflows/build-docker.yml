name: Build Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, xpu]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.variant }} image
      uses: docker/build-push-action@v6
      with:
        context: server
        file: server/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/callrecorder-server:${{ matrix.variant }}-latest
        build-args: |
          BASE_IMAGE=python:3.14-slim
          UV_EXTRAS=${{ matrix.variant }}
