[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisperx-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.0",
    "whisperx",
    "python-multipart==0.0.9",
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.4.0",
    "pyannote.audio>=3.1.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.3.0",
    "torchaudio",
]
xpu = [
    "torch>=2.3.0",
    "torchaudio",
    "triton-xpu>=3.7.0",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
